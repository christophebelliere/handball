name: Collecte FFHandball

# Toutes les 3 h une fois les secrets SFTP en place. GitHub peut decaler le
# depart de quelques minutes aux heures de pointe, sans consequence ici.
# Le cron GitHub n'utilise que UTC.
#
# Le planificateur est volontairement desactive tant que les 4 secrets
# IONOS_SFTP_* n'existent pas : sinon le job echoue 8 fois par jour et les
# e-mails d'echec finissent par etre ignores. Decommenter le bloc schedule
# (et supprimer celui du declenchement manuel doublon) une fois le site publie.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte ffhandball.fr
        run: python suivi_handball.py

      - name: Controle de coherence
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("matchs.json", encoding="utf-8"))
          n = sum(len(e["matchs"]) for e in d["equipes"])
          taille = os.path.getsize("index.html")
          print(f"{n} matchs, page de {taille} octets, "
                f"{len(d['equipes'])} equipes")
          if n < 10 or taille < 20000 or len(d["equipes"]) != 3:
              sys.exit("collecte incomplete : publication annulee, "
                       "le site en ligne reste intact")
          PY

      - name: Construction de dist/
        run: bash deploiement/construire.sh

      - name: Envoi SFTP
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
          SFTP_DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_DIR}" ]; then
            echo "Secrets SFTP manquants (IONOS_SFTP_HOST / _USER / _PASS / _DIR)." >&2
            exit 1
          fi

          # Un secret colle depuis un navigateur peut trainer un espace ou un
          # retour a la ligne : on nettoie, sinon le dossier cherche se termine
          # par une espace et n'existe pas.
          DIR="$(printf '%s' "${SFTP_DIR}" | tr -d '\r\n' \
                 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n[:space:]')"

          if [ -z "$DIR" ]; then
            echo "IONOS_SFTP_DIR est vide." >&2
            exit 1
          fi
          if [ "$DIR" = "/" ]; then
            echo "IONOS_SFTP_DIR vaut / : refus d'ecrire a la racine du compte." >&2
            exit 1
          fi
          if printf '%s' "$DIR" | grep -q '[[:space:]]'; then
            echo "IONOS_SFTP_DIR contient une espace : '$DIR'" >&2
            exit 1
          fi
          echo "Cible : $HOST:$DIR"

          # Envoi en Python (paramiko) plutot qu'en lftp : le module SFTP de
          # lftp delegue l'authentification a "ssh", qui ne lit pas ~/.netrc et
          # redemande donc un mot de passe qu'aucune saisie ne peut fournir en
          # CI (erreur "Login failed: Password required"). Paramiko recoit le
          # mot de passe par variable d'environnement, ne passe par aucun
          # shell, et distingue nettement "mauvais identifiants" et "dossier
          # inexistant".
          python -m pip install --quiet --disable-pip-version-check paramiko

          python - <<'PY'
          import os, posixpath, sys
          import paramiko

          host = os.environ["SFTP_HOST"].strip()
          user = os.environ["SFTP_USER"].strip()
          secret = os.environ["SFTP_PASS"]
          base = (os.environ["SFTP_DIR"].strip().rstrip("/")) or "/"

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          try:
              client.connect(host, port=22, username=user, password=secret,
                             timeout=30, banner_timeout=30, auth_timeout=30,
                             look_for_keys=False, allow_agent=False)
          except paramiko.AuthenticationException:
              sys.exit("Authentification refusee par %s : verifier "
                       "IONOS_SFTP_USER et IONOS_SFTP_PASS." % host)
          except Exception as erreur:
              sys.exit("Connexion a %s impossible : %s" % (host, erreur))
          print("Connecte a %s" % host)

          sftp = client.open_sftp()

          # Le dossier cible doit exister : IONOS le cree avec le sous-domaine.
          # On ne cree volontairement rien a ce niveau, pour qu'une erreur de
          # chemin se voie tout de suite au lieu de publier dans un dossier
          # fantome que le serveur web ne sert pas.
          try:
              sftp.stat(base)
          except IOError:
              sys.exit("Dossier %s introuvable sur %s : IONOS_SFTP_DIR doit "
                       "designer un dossier existant (celui du sous-domaine)."
                       % (base, host))

          envoyes = 0
          for dossier, _, fichiers in os.walk("dist"):
              relatif = os.path.relpath(dossier, "dist")
              cible = (base if relatif == "."
                       else posixpath.join(base, relatif.replace(os.sep, "/")))
              if relatif != ".":
                  try:
                      sftp.stat(cible)
                  except IOError:
                      sftp.mkdir(cible)
              for nom in sorted(fichiers):
                  sftp.put(os.path.join(dossier, nom),
                           posixpath.join(cible, nom))
                  envoyes += 1

          taille = sftp.stat(posixpath.join(base, "index.html")).st_size
          sftp.close()
          client.close()

          print("%d fichier(s) envoye(s) vers %s:%s" % (envoyes, host, base))
          print("index.html distant : %d octets" % taille)
          if taille < 20000:
              sys.exit("index.html distant anormalement petit (%d octets)."
                       % taille)
          PY

      - name: Sauvegarde des donnees dans le depot
        run: |
          set -euo pipefail
          git config user.name "collecte-ffhb"
          git config user.email "collecte@users.noreply.github.com"
          git add -A .suivi_handball_etat.json logos
          if git diff --staged --quiet; then
            echo "Aucun changement de donnees."
            exit 0
          fi
          git commit -m "Etat de suivi $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
