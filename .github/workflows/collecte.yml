name: Collecte FFHandball

# Toutes les 3 h, par deux planificateurs independants :
#
#   01:17 UTC  cron GitHub            -> 03:17 a Paris en hiver
#   01:42 UTC  Worker « declencheur » -> 03:42 a Paris en hiver
#
# GitHub decale ou oublie parfois ses declenchements aux heures de pointe ; le
# Worker Cloudflare, lui, part a l heure dite. Les deux existent volontairement :
# une collecte a moins de 2 h fait sauter la suivante (job « fraicheur »), donc
# le doublon ne coute rien et le trou de GitHub est comble.
on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Collecter meme si les donnees en ligne ont moins de 2 h"
        type: boolean
        default: false
  schedule:
    - cron: "17 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------- fraicheur
  # Un declenchement en double est sans effet : si le site publie des donnees
  # recentes, on s arrete ici, avant toute collecte. En cas de doute (site
  # injoignable), on collecte : mieux vaut un run de trop qu une page figee.
  fraicheur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collecter: ${{ steps.verif.outputs.collecter }}
    steps:
      - name: Age des donnees en ligne
        id: verif
        env:
          SEUIL_HEURES: "2"
          FORCER: ${{ inputs.forcer }}
          SITE: https://handball.belliere.fr
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone

          seuil = float(os.environ.get("SEUIL_HEURES", "2"))
          forcer = (os.environ.get("FORCER") or "false").lower() == "true"
          site = os.environ["SITE"]

          def decider(collecter, motif):
              print(motif)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("collecter=%s\n" % ("true" if collecter else "false"))

          if forcer:
              decider(True, "collecte forcee")
              sys.exit(0)

          try:
              with urllib.request.urlopen(site + "/matchs.json", timeout=20) as r:
                  genere = json.load(r)["genere_le"]
              t = datetime.fromisoformat(genere)
              if t.tzinfo is None:
                  t = t.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - t).total_seconds() / 3600
          except Exception as erreur:
              decider(True, "site illisible (%s) : on collecte" % erreur)
              sys.exit(0)

          if age < seuil:
              decider(False, "donnees en ligne vieilles de %.1f h (< %.0f h) : "
                             "collecte inutile" % (age, seuil))
          else:
              decider(True, "donnees en ligne vieilles de %.1f h (>= %.0f h)"
                            % (age, seuil))
          PY

  # ---------------------------------------------------------------- collecte
  collecte:
    needs: fraicheur
    if: needs.fraicheur.outputs.collecter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte ffhandball.fr
        run: python suivi_handball.py

      - name: Controle de coherence
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("matchs.json", encoding="utf-8"))
          n = sum(len(e["matchs"]) for e in d["equipes"])
          taille = os.path.getsize("index.html")
          print(f"{n} matchs, page de {taille} octets, "
                f"{len(d['equipes'])} equipes")
          if n < 10 or taille < 20000 or len(d["equipes"]) != 3:
              sys.exit("collecte incomplete : publication annulee, "
                       "le site en ligne reste intact")
          PY

      - name: Construction de dist/
        run: bash deploiement/construire.sh

      # --------------------------------------------------- Cloudflare Pages
      # Seule destination depuis la bascule DNS du 19/11/2026. Un echec ici
      # doit faire echouer le run : plus de filet IONOS derriere.
      - name: Deploiement Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Secrets Cloudflare manquants :" >&2
            echo "  CLOUDFLARE_API_TOKEN  (permission « Cloudflare Pages : Edit »)" >&2
            echo "  CLOUDFLARE_ACCOUNT_ID (visible dans l'URL du tableau de bord)" >&2
            exit 1
          fi

          # wrangler est epingle sur la version 4 : une montee de version
          # majeure peut renommer des options, on ne veut pas la subir.
          npx --yes wrangler@4 pages deploy dist \
            --project-name=handball-belliere \
            --branch=main \
            --commit-dirty=true

      - name: Sauvegarde des donnees dans le depot
        run: |
          set -euo pipefail
          git config user.name "collecte-ffhb"
          git config user.email "collecte@users.noreply.github.com"
          git add -A .suivi_handball_etat.json logos
          if git diff --staged --quiet; then
            echo "Aucun changement de donnees."
            exit 0
          fi
          git commit -m "Etat de suivi $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      # ------------------------------------------------- declencheur (Worker)
      # Redeploye a chaque collecte : le cron Cloudflare reste ainsi celui du
      # depot, jamais une version oubliee dans le tableau de bord. Place en
      # dernier : un echec ici ne prive de rien, la publication et la sauvegarde
      # de l etat sont deja faites.
      - name: Deploiement du declencheur
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 deploy --config deploiement/worker/wrangler.toml; then
            echo "Deploiement du Worker refuse." >&2
            echo "Le jeton Cloudflare doit porter la permission" >&2
            echo "  Account > Workers Scripts > Edit" >&2
            echo "en plus de Cloudflare Pages > Edit." >&2
            exit 1
          fi
# acteur : christophebelliere (identite du commit)
