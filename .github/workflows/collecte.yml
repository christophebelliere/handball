name: Collecte FFHandball

# Toutes les 3 h une fois les secrets SFTP en place. GitHub peut decaler le
# depart de quelques minutes aux heures de pointe, sans consequence ici.
# Le cron GitHub n'utilise que UTC.
#
# Le planificateur est volontairement desactive tant que les 4 secrets
# IONOS_SFTP_* n'existent pas : sinon le job echoue 8 fois par jour et les
# e-mails d'echec finissent par etre ignores. Decommenter le bloc schedule
# (et supprimer celui du declenchement manuel doublon) une fois le site publie.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte ffhandball.fr
        run: python suivi_handball.py

      - name: Controle de coherence
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("matchs.json", encoding="utf-8"))
          n = sum(len(e["matchs"]) for e in d["equipes"])
          taille = os.path.getsize("index.html")
          print(f"{n} matchs, page de {taille} octets, "
                f"{len(d['equipes'])} equipes")
          if n < 10 or taille < 20000 or len(d["equipes"]) != 3:
              sys.exit("collecte incomplete : publication annulee, "
                       "le site en ligne reste intact")
          PY

      - name: Construction de dist/
        run: bash deploiement/construire.sh

      - name: Envoi SFTP
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
          SFTP_DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_DIR}" ]; then
            echo "Secrets SFTP manquants (IONOS_SFTP_HOST / _USER / _PASS / _DIR)." >&2
            exit 1
          fi

          # Un secret colle depuis un navigateur peut trainer un espace ou un
          # retour a la ligne : on nettoie, sinon lftp cherche un dossier dont
          # le nom finit par une espace.
          DIR="$(printf '%s' "${SFTP_DIR}" | tr -d '\r\n' \
                 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n[:space:]')"

          if [ -z "$DIR" ]; then
            echo "IONOS_SFTP_DIR est vide." >&2
            exit 1
          fi
          if [ "$DIR" = "/" ]; then
            echo "IONOS_SFTP_DIR vaut / : refus d'ecrire a la racine du compte." >&2
            exit 1
          fi
          if printf '%s' "$DIR" | grep -q '[[:space:]]'; then
            echo "IONOS_SFTP_DIR contient une espace : '$DIR'" >&2
            exit 1
          fi
          echo "Cible : $HOST:$DIR"

          # Identifiants dans ~/.netrc : evite tout probleme de quoting avec
          # un mot de passe contenant espaces, quotes ou caracteres speciaux.
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / ".netrc"
          p.write_text(
              "machine {}\nlogin {}\npassword {}\n".format(
                  os.environ["SFTP_HOST"].strip(), os.environ["SFTP_USER"].strip(),
                  os.environ["SFTP_PASS"])
          )
          p.chmod(0o600)
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Le dossier cible doit exister : IONOS le cree avec le sous-domaine.
          # On ne fait volontairement pas de "mkdir -p" : mieux vaut un echec
          # explicite qu'un site publie dans un dossier fantome que personne
          # ne consulte.
          if ! lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            set cmd:fail-exit yes;
            open sftp://${HOST}:22;
            cd ${DIR};
            mirror -R --parallel=4 --verbose dist .;
            ls index.html;
            bye"; then
            echo "" >&2
            echo "Envoi SFTP en echec." >&2
            echo "Verifier IONOS_SFTP_HOST, _USER, _PASS, et surtout IONOS_SFTP_DIR :" >&2
            echo "ce dossier doit deja exister dans l'espace web (il est cree par" >&2
            echo "IONOS en meme temps que le sous-domaine)." >&2
            exit 1
          fi

      - name: Sauvegarde des donnees dans le depot
        run: |
          set -euo pipefail
          git config user.name "collecte-ffhb"
          git config user.email "collecte@users.noreply.github.com"
          git add -A .suivi_handball_etat.json logos
          if git diff --staged --quiet; then
            echo "Aucun changement de donnees."
            exit 0
          fi
          git commit -m "Etat de suivi $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
