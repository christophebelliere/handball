# Worker « declencheur » : appelle GitHub Actions a heure fixe.
#
# Deploiement (le workflow le fait a chaque collecte) :
#   npx wrangler@4 deploy --config deploiement/worker/wrangler.toml
#
# Secrets a creer une seule fois dans le tableau de bord, Worker -> Settings ->
# Variables and secrets :
#   GITHUB_TOKEN    jeton fin d acces, Actions: Read and write sur handball
#   JETON_MANUEL    facultatif, protege GET /declencher

name = "declencheur"
main = "declencheur.js"
compatibility_date = "2026-11-01"

# Le Worker n a pas besoin de domaine : le cron n appelle pas d URL.
workers_dev = true

[observability]
enabled = true

# Decale de 25 min par rapport au cron GitHub (:17). Les deux existent : GitHub
# reste en secours, et le garde-fou de fraicheur du workflow fait sauter le
# second declenchement quand les donnees en ligne ont moins de 2 h.
#
# Deuxieme cron, le samedi seulement : toutes les 30 min de 10 h a 22 h 37 UTC.
# Le job « fraicheur » ne retient que celles qui tombent entre 12 h et minuit
# heure de Paris (jamais de match le samedi matin) ; les autres gardent le seuil
# normal de 2 h et ne collectent donc pas en double. Le garde-fou baisse alors le
# seuil a 25 min, sinon chaque passage serait saute. Les minutes :07 et :37
# evitent de doubler le cron de 3 h (:42). Ce rythme n existe que cote
# Cloudflare, c est lui qui part a l heure dite ; un second planificateur rapide
# ne ferait que dupliquer des declenchements, avec un run sur deux saute par le
# garde-fou.
[triggers]
crons = [
  "42 1,4,7,10,13,16,19,22 * * *",
  "7,37 10-22 * * 6",
]
